name: Deploy

on:
  push:
    branches: [main]

# Never let two deploys of main overlap.
concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    name: Test & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Build the web app first: it generates next-env.d.ts and .next/types
      # that the web typecheck depends on, and proves the production build.
      - name: Build web
        run: pnpm --filter @superscout/web build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Test
        run: pnpm -r test

  deploy:
    name: Deploy to Ubuntu
    needs: test
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Build image & (re)start container
        run: docker compose up -d --build

      # A container restart already kicks off an ingest, but it runs the
      # 20-minute catalogue crawl in the same pass, so the next deploy can kill
      # it midway. This is an explicit offers-only refresh that finishes in about
      # a minute and, crucially, reports whether it worked — the failure this
      # replaces was silent: the web app fell back to the bundled July snapshot
      # and served it as this week's offers.
      - name: Refresh offers
        run: |
          # Offers only: the catalogue crawl takes twenty minutes and has its
          # own nightly pass, so a deploy should not wait on it.
          docker exec -e INGEST_ONCE=1 -e SKIP_ASSORTMENT=1 superscout-ingestion \
            node --experimental-sqlite packages/ingestion/dist/ingest.cjs 2>&1 | tail -20

      # Verified from inside the web container, not the worker. The worker
      # reading its own output proves nothing: it runs as root and wrote the
      # file. The question that matters is whether the container serving the
      # site can read it, and that is a different user on a shared volume.
      - name: Verify the web app can read the offers
        run: |
          docker exec superscout-web node -e "
            const o = JSON.parse(require('fs').readFileSync(process.env.OFFERS_PATH, 'utf8'));
            const chains = [...new Set(o.map(x => x.source))].sort();
            console.log('offers:', o.length, '| ketens:', chains.join(' '));
            if (o.length < 100) {
              console.error('Te weinig aanbiedingen - controleer de adapters');
              process.exit(1);
            }
          "

      # And end to end, because a readable file is still not a working page:
      # the homepage was serving zero while this exact file parsed fine.
      - name: Verify the homepage shows them
        run: |
          for i in 1 2 3 4 5 6; do
            body=$(docker exec superscout-web wget -qO- http://127.0.0.1:3000/ || true)
            count=$(printf '%s' "$body" | grep -oE '[0-9]+ aanbiedingen' | head -1 | grep -oE '^[0-9]+' || echo 0)
            echo "poging $i: $count aanbiedingen op de homepage"
            if [ "${count:-0}" -ge 100 ]; then exit 0; fi
            sleep 5
          done
          echo "De homepage toont geen aanbiedingen terwijl het bestand wel leesbaar is."
          exit 1

      - name: Remove dangling images
        run: docker image prune -f

      # Push the fresh URL set to Bing/Yandex/Seznam/Naver. Non-fatal: a search
      # engine being down must never fail a deploy that already succeeded.
      - name: Notify IndexNow
        continue-on-error: true
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          SITE_URL: https://superscout.nl
        run: |
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null "$SITE_URL/sitemap.xml" && break
            sleep 5
          done
          node apps/web/scripts/indexnow.mjs
