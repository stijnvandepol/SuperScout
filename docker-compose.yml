services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    image: superscout-web:latest
    container_name: superscout-web
    environment:
      - OFFERS_PATH=/data/offers.json
      # Expired promotions, retained so their URLs keep resolving instead of
      # 404ing the week after. Read lazily — never on the hot listing path.
      - ARCHIVE_PATH=/data/offers-archive.json
      - PRICE_HISTORY_PATH=/data/price-history.jsonl
      # SEO/webmaster wiring — all optional, read at render time.
      # Empty values omit the tag / 404 the key file, which is the safe default.
      - GOOGLE_SITE_VERIFICATION=${GOOGLE_SITE_VERIFICATION:-}
      - BING_SITE_VERIFICATION=${BING_SITE_VERIFICATION:-}
      - INDEXNOW_KEY=${INDEXNOW_KEY:-}
    volumes:
      - offers-data:/data
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ingestion:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingest
    image: superscout-ingestion:latest
    container_name: superscout-ingestion
    environment:
      - OFFERS_OUT=/data/offers.json
      # Rolling 120-day archive of every promotion seen, incl. expired and
      # next-week ones. Like the price log, its value is accumulated time.
      - ARCHIVE_OUT=/data/offers-archive.json
      # Append-only price log on the same persistent volume. Its whole value is
      # accumulated time, so it must outlive every container rebuild.
      - PRICE_HISTORY_OUT=/data/price-history.jsonl
      # Runs once on start, then every morning at this UTC hour (5 ≈ 07:00 NL).
      - INGEST_HOUR=5
    volumes:
      - offers-data:/data
    restart: unless-stopped

volumes:
  offers-data:
